name: "Push to master branch"
on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  id-token: write # Required for OIDC login to Radix (deploy_to_radix.yml)

concurrency:
  group: on-push-master-deploy
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  build-test-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Create report"
        run: |
          docker build --target dev --tag api-development ./api
          docker run --name algorithm-report api-development python src/tests/optimizer_test.py
          docker cp algorithm-report:/app/src/test_report.png test_report.png

      - name: Archive results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: algorithm-report
          path: test_report.png

  publish-latest:
    needs: tests
    uses: ./.github/workflows/publish-image.yml
    with:
      environment-tag: latest
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_PASSWORD: ${{ secrets.DHI_PASSWORD }}

  deploy:
    needs: publish-latest
    uses: ./.github/workflows/deploy_to_radix.yml
    with:
      radix-environment: "dev"
