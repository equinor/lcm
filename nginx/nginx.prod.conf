# Production config: serves the built SPA and reverse-proxies /api and /oauth2.
# Runs on nginxinc/nginx-unprivileged with a read-only root filesystem, so all writable paths are under /tmp.
pid                         /tmp/nginx.pid;
worker_processes            auto;

events {
    multi_accept            on;
    worker_connections      1024;
}

http {
    include                 /etc/nginx/mime.types;
    default_type            application/octet-stream;
    sendfile                on;
    server_tokens           off;

    proxy_temp_path         /tmp/proxy_temp;
    client_body_temp_path   /tmp/client_temp;
    fastcgi_temp_path       /tmp/fastcgi_temp;
    uwsgi_temp_path         /tmp/uwsgi_temp;
    scgi_temp_path          /tmp/scgi_temp;

    # These parameters fix too 'large headers' from Entra Tokens.
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Long Radix hostnames exceed the default bucket size of 64
    server_names_hash_bucket_size 128;

    # Legacy "test" environment URL (Radix dnsAlias on dev) -> dev environment
    server {
        listen 8080;
        server_name proxy-lost-circulation-material-test.radix.equinor.com;
        access_log /dev/stdout combined;
        return 301 https://nginx-lost-circulation-material-dev.radix.equinor.com$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name localhost;
        client_max_body_size    0;  # disable upload limit as it is handled by Radix

        access_log /dev/stdout combined;
        error_log /dev/stdout;

        include /etc/nginx/config/oauth2.conf;
        include /etc/nginx/config/api.conf;

        location / {
            root        /usr/share/nginx/html;
            try_files   $uri $uri/ /index.html;

            auth_request /oauth2/auth;

            include /etc/nginx/config/security-headers.conf;
            error_page 401 = /oauth2/sign_in;
        }
    }
}
