# Unauthenticated endpoint used by the CI deployment check
location = /api/about {
    proxy_pass http://api:5000/api/about;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
}

location /api {
    proxy_pass http://api:5000/api;
    proxy_http_version                  1.1;
    add_header Last-Modified            $date_gmt;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_set_header Host               $host;
    proxy_set_header X-Request-Start    $msec;

    auth_request                                /oauth2/auth;

    # if you enabled --pass-access-token, this will pass the token to the backend
    auth_request_set $token                     $upstream_http_authorization;
    proxy_set_header Authorization              $token;

    auth_request_set $access_token              $upstream_http_x_auth_request_access_token;
    proxy_set_header X-Forwarded-Access-Token   $access_token;

    proxy_read_timeout                  180;
    error_page                          401 = @api_unauthorized;
}

location @api_unauthorized {
    return 401;
}
