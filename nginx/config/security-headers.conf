add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
# Single source of truth for the app's CSP
# The script-src hash only allows the inline React Refresh preamble injected by the Vite dev server (local development)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' https://*.equinor.com 'unsafe-inline'; img-src 'self' data:; object-src 'none'; font-src 'self' https://*.equinor.com; connect-src 'self' https://*.microsoftonline.com https://*.applicationinsights.azure.com https://*.monitor.azure.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
