# Included at server level so every response gets these headers.
# nginx drops inherited add_header directives in any location that defines its own add_header,
# so such locations must include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No "preload": *.radix.equinor.com hosts can't be added to the HSTS preload list. Matches the value sent by the Radix ingress.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
# The app uses none of these browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Safe because sign-in is a full-page redirect, not a popup
add_header Cross-Origin-Opener-Policy "same-origin" always;
