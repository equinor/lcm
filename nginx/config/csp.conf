# Single source of truth for the app's CSP
# $csp_dev_script_src must be defined by the including nginx config (empty in production)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'$csp_dev_script_src; style-src 'self' https://*.equinor.com 'unsafe-inline'; img-src 'self' data:; object-src 'none'; font-src 'self' https://*.equinor.com; connect-src 'self' https://*.microsoftonline.com https://*.applicationinsights.azure.com https://*.monitor.azure.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
